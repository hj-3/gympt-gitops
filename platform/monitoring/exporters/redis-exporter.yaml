apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: gympt-prod
  labels:
    app.kubernetes.io/name: redis-exporter
    app.kubernetes.io/part-of: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-exporter
        app.kubernetes.io/part-of: monitoring
    spec:
      containers:
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.62.0
          imagePullPolicy: IfNotPresent
          args:
            - --skip-tls-verification
          env:
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: backend-api-prod-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: backend-api-prod-config
                  key: REDIS_PORT
            - name: REDIS_ADDR
              value: rediss://$(REDIS_HOST):$(REDIS_PORT)
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-api-prod-secrets
                  key: REDIS_PASSWORD
          ports:
            - name: metrics
              containerPort: 9121
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  namespace: gympt-prod
  labels:
    app.kubernetes.io/name: redis-exporter
    app.kubernetes.io/part-of: monitoring
spec:
  selector:
    app.kubernetes.io/name: redis-exporter
  ports:
    - name: metrics
      port: 9121
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis-exporter
  namespace: gympt-prod
  labels:
    app.kubernetes.io/name: redis-exporter
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-exporter
  namespaceSelector:
    matchNames:
      - gympt-prod
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      relabelings:
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        - sourceLabels: [__meta_kubernetes_service_name]
          targetLabel: service
